[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "relay"
version = "1.0.0"
description = "Relay: durable AI workflow orchestrator"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "psycopg[binary,pool]>=3.2", "httpx>=0.27", "jsonschema>=4.23"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
relay-api = "relay.api:main"
relay-worker = "relay.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
relay = ["schema.sql", "console/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
