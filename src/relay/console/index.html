<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Relay Console</title>
<style>
:root {
  color-scheme: light;
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #f0f2f5;
  --border: #e1e4e9;
  --border-strong: #cdd2da;
  --text: #191c21;
  --muted: #5d6572;
  --accent: #3451d1;
  --accent-hover: #2a43b3;
  --accent-fg: #ffffff;
  --danger: #c02a31;
  --danger-hover: #a3222a;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05);
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  --grey: #4b5563;       --grey-bg: #eceef2;
  --blue: #1d4ed8;       --blue-bg: #e2eaff;
  --amber: #9a5800;      --amber-bg: #fff0d1;
  --green: #157a3a;      --green-bg: #dff4e6;
  --red: #bb2329;        --red-bg: #fde4e5;
  --slate: #475569;      --slate-bg: #e3e8ef;
  --violet: #6b2bd6;     --violet-bg: #eee6ff;
  --orange: #b9420b;     --orange-bg: #ffe8d8;
  --teal: #0f766e;       --teal-bg: #d9f3f0;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0e1015;
    --surface: #161920;
    --surface-2: #1d2129;
    --border: #2a2f39;
    --border-strong: #3a404c;
    --text: #e5e7eb;
    --muted: #9aa2ae;
    --accent: #7d93ff;
    --accent-hover: #95a7ff;
    --accent-fg: #0e1015;
    --danger: #ff7a80;
    --danger-hover: #ff959a;
    --shadow: none;

    --grey: #c2c7cf;   --grey-bg: #272b33;
    --blue: #8eb0ff;   --blue-bg: #19284a;
    --amber: #ffc95e;  --amber-bg: #392a0c;
    --green: #6fd896;  --green-bg: #12301f;
    --red: #ff8a8f;    --red-bg: #3c1518;
    --slate: #a9b4c5;  --slate-bg: #242b37;
    --violet: #c3a6ff; --violet-bg: #291e44;
    --orange: #ffaa74; --orange-bg: #3a2113;
    --teal: #6fd8cc;   --teal-bg: #10302d;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1 { font-size: 22px; line-height: 1.25; margin: 0; font-weight: 650; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
h2 { font-size: 15px; margin: 22px 0 10px; font-weight: 650; }
h3 { font-size: 13px; margin: 14px 0 6px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
h4 { font-size: 12px; margin: 12px 0 6px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
p { margin: 6px 0; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
code { background: var(--surface-2); border: 1px solid var(--border); padding: 0 4px; border-radius: 4px; overflow-wrap: anywhere; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }

/* top bar */
header.top { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--border); }
header.top .inner { max-width: 1240px; margin: 0 auto; padding: 0 24px; height: 54px; display: flex; align-items: center; gap: 22px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; color: var(--text); letter-spacing: -.01em; }
.brand:hover { text-decoration: none; }
.brand .mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; color: var(--accent-fg); font-size: 13px; font-weight: 800; }
.brand small { font-weight: 500; color: var(--muted); font-size: 12px; }
nav#nav { display: flex; gap: 2px; flex: 1; }
nav#nav a { color: var(--muted); padding: 6px 11px; border-radius: 7px; font-weight: 550; display: inline-flex; align-items: center; gap: 6px; }
nav#nav a:hover { background: var(--surface-2); color: var(--text); text-decoration: none; }
nav#nav a.active { background: var(--surface-2); color: var(--text); }
.count { display: none; min-width: 19px; height: 19px; padding: 0 6px; border-radius: 999px; background: var(--amber-bg); color: var(--amber); font-size: 11.5px; font-weight: 700; align-items: center; justify-content: center; }
.count.show { display: inline-flex; }
.top-right { display: flex; align-items: center; gap: 10px; }
.conn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.conn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--grey); }
.conn.ok .dot { background: var(--green); }
.conn.bad .dot { background: var(--red); }

main { max-width: 1240px; margin: 0 auto; padding: 22px 24px 60px; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
.sub { color: var(--muted); margin: 6px 0 0; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
.sub > span { white-space: nowrap; }

/* buttons + inputs */
button, .btn { font: inherit; font-weight: 600; font-size: 13px; border-radius: 7px; padding: 6px 13px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-fg); cursor: pointer; line-height: 1.4; }
button:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); }
button:disabled { opacity: .5; cursor: not-allowed; }
button.ghost { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
button.ghost:hover:not(:disabled) { background: var(--surface-2); border-color: var(--border-strong); }
button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
button.danger:hover:not(:disabled) { background: var(--danger-hover); border-color: var(--danger-hover); }
button.ok { background: var(--green); border-color: var(--green); color: #fff; }
@media (prefers-color-scheme: dark) { button.danger, button.ok { color: #0e1015; } }
input, select, textarea { font: inherit; font-size: 13px; color: var(--text); background: var(--surface); border: 1px solid var(--border-strong); border-radius: 7px; padding: 6px 9px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
textarea { width: 100%; font-family: var(--mono); font-size: 12.5px; resize: vertical; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
.spacer { flex: 1; }

/* cards + layout */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow); }
.card > h2:first-child, .card > h3:first-child { margin-top: 0; }
.cols { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.cols-even { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 900px) { .cols, .cols-even { grid-template-columns: minmax(0, 1fr); } header.top .inner { gap: 10px; } .brand small { display: none; } }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: block; color: var(--text); box-shadow: var(--shadow); }
a.tile:hover { text-decoration: none; border-color: var(--border-strong); }
.tile .n { font-size: 26px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.tile .l { margin-top: 6px; font-size: 12px; color: var(--muted); }
.tile.st-waiting_approval .n, .tile.hot .n { color: var(--amber); }
.tile.st-failed .n { color: var(--red); }
.tile.st-running .n { color: var(--blue); }
.tile.st-succeeded .n { color: var(--green); }

/* tables */
.table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: auto; box-shadow: var(--shadow); }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 650; padding: 9px 12px; background: var(--surface-2); border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tbody tr:hover td { background: color-mix(in srgb, var(--surface-2) 55%, transparent); }
td.num { font-variant-numeric: tabular-nums; }
.trunc { max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.empty { padding: 26px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--border-strong); border-radius: 10px; }

/* status classes (shared by badges, step cards, tiles) */
.st-queued, .st-unknown, .st-in_flight_unknown { --c: var(--grey); --cb: var(--grey-bg); }
.st-running, .st-in_flight { --c: var(--blue); --cb: var(--blue-bg); }
.st-waiting_approval, .st-waiting, .st-pending, .st-draft { --c: var(--amber); --cb: var(--amber-bg); }
.st-succeeded, .st-approved, .st-published, .st-ok { --c: var(--green); --cb: var(--green-bg); }
.st-failed, .st-rejected, .st-down { --c: var(--red); --cb: var(--red-bg); }
.st-cancelled, .st-closed, .st-interrupted { --c: var(--slate); --cb: var(--slate-bg); }
.st-sleeping { --c: var(--violet); --cb: var(--violet-bg); }
.st-retrying, .st-transient_error, .st-flaky { --c: var(--orange); --cb: var(--orange-bg); }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 650; color: var(--c, var(--grey)); background: var(--cb, var(--grey-bg)); white-space: nowrap; line-height: 1.6; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.st-running::before, .badge.st-retrying::before { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
h1 .badge { font-size: 13px; }

/* pills + types */
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); white-space: nowrap; }
.pill.ok { background: var(--green-bg); color: var(--green); border-color: transparent; }
.pill.bad { background: var(--red-bg); color: var(--red); border-color: transparent; }
.pill.warn { background: var(--amber-bg); color: var(--amber); border-color: transparent; }
.pill.info { background: var(--blue-bg); color: var(--blue); border-color: transparent; }
.pill.violet { background: var(--violet-bg); color: var(--violet); border-color: transparent; }
.type { font-family: var(--mono); font-size: 11.5px; padding: 1px 7px; border-radius: 5px; background: var(--slate-bg); color: var(--slate); font-weight: 600; white-space: nowrap; }
.type.t-ai { background: var(--violet-bg); color: var(--violet); }
.type.t-condition { background: var(--teal-bg); color: var(--teal); }
.type.t-approval { background: var(--amber-bg); color: var(--amber); }
.type.t-http, .type.t-action, .type.t-side_effect { background: var(--blue-bg); color: var(--blue); }
.type.t-delay, .type.t-sleep, .type.t-wait { background: var(--violet-bg); color: var(--violet); }
.edge { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.edge b { color: var(--text); font-weight: 600; }

/* boxes */
.box { border-radius: 10px; padding: 11px 14px; margin: 12px 0; border: 1px solid transparent; }
.box b.t { display: block; margin-bottom: 2px; }
.error-box { background: var(--red-bg); color: var(--red); }
.error-box .msg { color: var(--text); }
.risk-box { background: var(--amber-bg); color: var(--amber); border-color: color-mix(in srgb, var(--amber) 35%, transparent); }
.risk-box .flags { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 4px; color: var(--text); }
.risk-box .flags li { font-size: 12.5px; }
.approval-box { background: var(--amber-bg); border: 1.5px solid var(--amber); }
.approval-box .msg { color: var(--text); font-size: 15px; font-weight: 600; margin: 2px 0 4px; }
.approval-box .lbl { color: var(--amber); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.info-box { background: var(--blue-bg); color: var(--text); }
ul.issues { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; }
ul.issues li { padding: 7px 10px; border-radius: 7px; font-size: 13px; }
ul.issues li.error { background: var(--red-bg); color: var(--red); }
ul.issues li.warn { background: var(--amber-bg); color: var(--text); }
a.btn { display: inline-block; text-decoration: none; }
a.btn.ghost { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.ok-box { background: var(--green-bg); color: var(--green); }
ul.issues { list-style: none; padding: 0; margin: 12px 0; display: grid; gap: 6px; }
ul.issues li { padding: 7px 12px; border-radius: 8px; font-size: 13px; }
ul.issues li.error { background: var(--red-bg); }
ul.issues li.warn { background: var(--amber-bg); }
ul.issues li b { font-family: var(--mono); font-size: 12px; margin-right: 6px; }
ul.issues li.error b { color: var(--red); }
ul.issues li.warn b { color: var(--amber); }

/* json */
pre { margin: 0; }
pre.json { font-family: var(--mono); font-size: 12px; line-height: 1.5; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; max-height: 320px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
details > summary { cursor: pointer; color: var(--muted); font-size: 12.5px; font-weight: 600; user-select: none; padding: 4px 0; list-style-position: inside; }
details > summary:hover { color: var(--text); }
details.block { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 14px; margin-top: 10px; }
details.block[open] > summary { margin-bottom: 8px; }

/* workflow nodes */
ol.nodes { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; counter-reset: n; }
ol.nodes > li { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; padding: 9px 12px; counter-increment: n; }
ol.nodes > li.entry { border-color: var(--accent); }
ol.nodes .nh { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
ol.nodes .nh::before { content: counter(n); font-family: var(--mono); font-size: 11px; color: var(--muted); min-width: 14px; }
ol.nodes .edges { display: flex; gap: 12px; flex-wrap: wrap; margin-left: auto; }

/* run timeline */
ol.timeline { list-style: none; padding: 0 0 0 22px; margin: 0; position: relative; }
ol.timeline::before { content: ""; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 2px; background: var(--border); }
li.step { position: relative; margin-bottom: 10px; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--c, var(--border)); border-radius: 9px; padding: 10px 14px; box-shadow: var(--shadow); }
li.step::before { content: ""; position: absolute; left: -21px; top: 14px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 3px solid var(--c, var(--grey)); }
.step-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 9px; }
.step-head .seq { font-family: var(--mono); color: var(--muted); font-size: 12px; font-weight: 600; }
.step-head .nid { font-family: var(--mono); font-weight: 650; font-size: 13.5px; }
.step-meta { color: var(--muted); font-size: 12.5px; }
.step .pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.step .pills:empty { display: none; }
.step details { margin-top: 6px; }
.call { border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; margin: 8px 0; background: var(--surface); }
.call.bad { border-color: color-mix(in srgb, var(--red) 45%, transparent); }
.call .ch { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12.5px; }
.call ul { margin: 4px 0 8px; padding-left: 18px; color: var(--red); font-size: 12.5px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }

/* approvals list */
ul.approvals { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
ul.approvals li { background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--amber); border-radius: 9px; padding: 12px 16px; box-shadow: var(--shadow); }
ul.approvals .msg { font-weight: 600; font-size: 14.5px; }

/* world */
.world-state { display: flex; gap: 10px; flex-wrap: wrap; }
.world-state .tile { min-width: 140px; }

/* toast */
#toast { position: fixed; right: 20px; bottom: 20px; max-width: 440px; padding: 10px 16px; border-radius: 9px; font-weight: 600; font-size: 13px; background: var(--text); color: var(--bg); opacity: 0; transform: translateY(8px); transition: opacity .18s, transform .18s; pointer-events: none; z-index: 50; box-shadow: 0 6px 24px rgba(0, 0, 0, .18); }
#toast.show { opacity: 1; transform: none; }
#toast.err { background: var(--red); color: #fff; }
@media (prefers-color-scheme: dark) { #toast.err { color: #0e1015; } }
.loading { padding: 30px 0; }
</style>
</head>
<body>
<header class="top">
  <div class="inner">
    <a class="brand" href="#/"><span class="mark">R</span>Relay <small>operator console</small></a>
    <nav id="nav">
      <a href="#/" data-nav="/">Dashboard</a>
      <a href="#/workflows" data-nav="/workflows">Workflows</a>
      <a href="#/build" data-nav="/build">Build</a>
      <a href="#/runs" data-nav="/runs">Runs</a>
      <a href="#/approvals" data-nav="/approvals">Approvals <span id="apr-badge" class="count"></span></a>
      <a href="#/world" data-nav="/world">Mock world</a>
    </nav>
    <div class="top-right">
      <span id="conn" class="conn" title="API connection"><span class="dot"></span><span id="conn-text">connecting…</span></span>
      <button id="token-btn" class="ghost" type="button" title="Set the API bearer token">Token</button>
    </div>
  </div>
</header>
<main id="view"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module">
// ---------------------------------------------------------------------------
// Utilities. SECURITY: every untrusted value is passed through esc() before it
// is placed in markup. Webhook payloads intentionally contain injection text.
// ---------------------------------------------------------------------------
const ESC_MAP = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;", "`": "&#96;" };
const esc = (v) => String(v ?? "").replace(/[&<>"'`]/g, (c) => ESC_MAP[c]);
const $ = (sel, root = document) => root.querySelector(sel);
const TERMINAL = new Set(["succeeded", "failed", "cancelled"]);
const RUN_STATUSES = ["queued", "running", "waiting_approval", "succeeded", "failed", "cancelled"];

const stClass = (s) => "st-" + String(s ?? "unknown").replace(/[^a-zA-Z0-9_]/g, "");
const badge = (s) => `<span class="badge ${stClass(s)}">${esc(String(s ?? "unknown").replace(/_/g, " "))}</span>`;
const json = (v) => `<pre class="json">${esc(v === undefined ? "null" : JSON.stringify(v, null, 2))}</pre>`;
const typeTag = (t) => `<span class="type t-${esc(String(t ?? "").replace(/[^a-zA-Z0-9_]/g, ""))}">${esc(t)}</span>`;
const num = (n) => (typeof n === "number" ? esc(n.toLocaleString()) : esc(n ?? "—"));

function toDate(v) {
  if (v == null || v === "") return null;
  if (typeof v === "number") return new Date(v < 1e12 ? v * 1000 : v);
  const d = new Date(v);
  return isNaN(d) ? null : d;
}
const time = (v) => { const d = toDate(v); return d ? esc(d.toLocaleTimeString()) : "—"; };
function ago(v) {
  const d = toDate(v); if (!d) return "—";
  const s = Math.max(0, Math.round((Date.now() - d) / 1000));
  const txt = s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s / 60)}m ago` : s < 86400 ? `${Math.round(s / 3600)}h ago` : `${Math.round(s / 86400)}d ago`;
  return `<span title="${esc(d.toLocaleString())}">${esc(txt)}</span>`;
}
function dur(ms) {
  if (ms == null || isNaN(ms)) return "—";
  return ms < 1000 ? `${Math.round(ms)} ms` : ms < 60000 ? `${(ms / 1000).toFixed(1)} s` : `${Math.floor(ms / 60000)}m ${Math.round((ms % 60000) / 1000)}s`;
}

function toast(msg, kind = "ok") {
  const t = $("#toast");
  t.textContent = String(msg);
  t.className = `show ${kind}`;
  clearTimeout(t._h);
  t._h = setTimeout(() => { t.className = ""; }, 3800);
}

function table(cols, rows, empty = "Nothing here yet.") {
  if (!rows || !rows.length) return `<div class="empty">${esc(empty)}</div>`;
  return `<div class="table-wrap"><table><thead><tr>${cols.map((c) => `<th>${esc(c.label)}</th>`).join("")}</tr></thead><tbody>${rows
    .map((r) => `<tr>${cols.map((c) => `<td class="${esc(c.cls || "")}">${c.render(r)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

function errBox(e) {
  const hint = e && e.status === 401 ? `<div class="msg small">Use the <b>Token</b> button (top right) to set the API token.</div>` : "";
  return `<div class="box error-box"><b class="t">${esc(e?.code || "error")}</b><div class="msg">${esc(e?.message || String(e))}</div>${hint}</div>`;
}

// Re-render a container while keeping open <details>, focus/caret and <pre> scroll positions.
function patch(el, html) {
  const opened = new Set(), known = new Set(), scrolls = new Map();
  el.querySelectorAll("details[data-k]").forEach((d) => { known.add(d.dataset.k); if (d.open) opened.add(d.dataset.k); });
  el.querySelectorAll("[data-s]").forEach((p) => { if (p.scrollTop || p.scrollLeft) scrolls.set(p.dataset.s, [p.scrollTop, p.scrollLeft]); });
  const act = document.activeElement;
  const focusId = act && el.contains(act) && act.id ? act.id : null;
  const sel = focusId && typeof act.selectionStart === "number" ? [act.selectionStart, act.selectionEnd] : null;
  el.innerHTML = html;
  el.querySelectorAll("details[data-k]").forEach((d) => { if (known.has(d.dataset.k)) d.open = opened.has(d.dataset.k); });
  el.querySelectorAll("[data-s]").forEach((p) => { const s = scrolls.get(p.dataset.s); if (s) { p.scrollTop = s[0]; p.scrollLeft = s[1]; } });
  if (focusId) {
    const f = el.querySelector(`#${CSS.escape(focusId)}`);
    if (f) { f.focus(); if (sel && f.setSelectionRange) { try { f.setSelectionRange(sel[0], sel[1]); } catch { /* not a text input */ } } }
  }
}

const TOKEN_KEY = "relay.token", DECIDER_KEY = "relay.decider", DEFAULT_TOKEN = "relay-demo-token";
function sget(k) { try { return localStorage.getItem(k); } catch { return null; } }
function sset(k, v) { try { localStorage.setItem(k, v); } catch { /* storage unavailable */ } }
let memToken = null, memDecider = null;
const getToken = () => memToken || sget(TOKEN_KEY) || DEFAULT_TOKEN;
const setToken = (t) => { memToken = t; sset(TOKEN_KEY, t); };
const getDecider = () => memDecider ?? sget(DECIDER_KEY) ?? "demo-operator";

let healthInfo = "";
function setConn(ok, why) {
  const c = $("#conn");
  c.classList.toggle("ok", ok); c.classList.toggle("bad", !ok);
  $("#conn-text").textContent = ok ? (healthInfo || "API online") : (why || "API unreachable");
}

async function api(path, { method = "GET", body } = {}) {
  const headers = { Authorization: `Bearer ${getToken()}`, Accept: "application/json" };
  if (body !== undefined) headers["Content-Type"] = "application/json";
  let res;
  try {
    res = await fetch(path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
  } catch {
    setConn(false);
    throw Object.assign(new Error("Cannot reach the Relay API."), { code: "network_error", status: 0 });
  }
  if (res.status === 401) setConn(false, "unauthorized"); else if (res.status < 500) setConn(true); else setConn(false, `API error ${res.status}`);
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = { raw: text }; }
  if (!res.ok) {
    const detail = data?.detail ? (typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail)) : null;
    const err = new Error(data?.error?.message || detail || `${res.status} ${res.statusText}`);
    Object.assign(err, { status: res.status, code: data?.error?.code || `http_${res.status}`, details: data?.error?.details, data });
    throw err;
  }
  return data;
}

// ---------------------------------------------------------------------------
// Router with per-view lifecycle (timers are cleaned up on navigation).
// ---------------------------------------------------------------------------
function makeCtx() {
  const timers = new Set();
  const ctx = {
    alive: true,
    // Run fn every `ms` (sequentially, never overlapping). fn returning false stops the loop.
    every(fn, ms) {
      const schedule = () => {
        if (!ctx.alive) return;
        const t = setTimeout(async () => {
          timers.delete(t);
          if (!ctx.alive) return;
          let keep = true;
          try { keep = (await fn()) !== false; } catch { /* transient: keep polling */ }
          if (keep) schedule();
        }, ms);
        timers.add(t);
      };
      schedule();
    },
    later(fn, ms) { const t = setTimeout(() => { timers.delete(t); if (ctx.alive) fn(); }, ms); timers.add(t); },
    dispose() { ctx.alive = false; timers.forEach(clearTimeout); timers.clear(); },
  };
  return ctx;
}

const ROUTES = [
  [/^\/?$/, viewDashboard],
  [/^\/workflows\/?$/, viewWorkflows],
  [/^\/build\/?$/, viewBuild],
  [/^\/workflows\/([^/]+)$/, viewWorkflow],
  [/^\/runs\/?$/, viewRuns],
  [/^\/runs\/([^/]+)$/, viewRun],
  [/^\/approvals\/?$/, viewApprovals],
  [/^\/world\/?$/, viewWorld],
];
let activeCtx = null;

function parseHash() {
  const h = location.hash.replace(/^#/, "") || "/";
  const i = h.indexOf("?");
  return { path: i < 0 ? h : h.slice(0, i), query: new URLSearchParams(i < 0 ? "" : h.slice(i + 1)) };
}
const safeDecode = (s) => { try { return decodeURIComponent(s); } catch { return s; } };

async function route() {
  if (activeCtx) activeCtx.dispose();
  const ctx = makeCtx();
  activeCtx = ctx;
  const { path, query } = parseHash();
  document.querySelectorAll("#nav a[data-nav]").forEach((a) => {
    const n = a.dataset.nav;
    a.classList.toggle("active", n === "/" ? path === "/" || path === "" : path === n || path.startsWith(n + "/"));
  });
  const view = $("#view");
  const el = document.createElement("div");
  el.innerHTML = `<p class="muted loading">Loading…</p>`;
  view.replaceChildren(el);
  window.scrollTo(0, 0);
  for (const [re, fn] of ROUTES) {
    const m = path.match(re);
    if (!m) continue;
    try {
      await fn(el, ctx, m.slice(1).map(safeDecode), query);
    } catch (e) {
      if (!ctx.alive) return;
      const retry = !e.status || e.status >= 500;
      el.innerHTML = errBox(e) + (retry ? `<p class="muted small">Retrying in 3 s…</p>` : "");
      if (retry) ctx.later(() => { if (activeCtx === ctx) route(); }, 3000);
    }
    return;
  }
  el.innerHTML = `<div class="empty">Page not found. <a href="#/">Back to dashboard</a></div>`;
}

function edgesHtml(n) {

          <a class="btn ghost" href="#/build?id=${esc(encodeURIComponent(wf.id))}">Edit</a>
          ${published ? "" : `<span class="muted small">Publish before triggering.</span>`}
        </div>
        <div id="pub-out"></div>
      </section>
    </div>
    <details class="block" data-k="def"><summary>Definition JSON</summary>${json(d)}</details>`;

  const ta = $("#input", el), note = $("#sample-note", el);
  $("#sample", el).addEventListener("change", (e) => {
    const s = mine.find((x) => x.id === e.target.value);
    ta.value = JSON.stringify(s ? s.body ?? {} : {}, null, 2);
    note.innerHTML = s ? `${esc(s.note || "")}${s.expected !== undefined ? `<br>expected: <code>${esc(typeof s.expected === "string" ? s.expected : JSON.stringify(s.expected))}</code>` : ""}` : "";
  });
  $("#trigger", el).addEventListener("click", async (e) => {
    let input;
    try { input = JSON.parse(ta.value || "{}"); } catch (err) { toast(`Invalid JSON: ${err.message}`, "err"); return; }
    e.currentTarget.disabled = true;
    try {
      const r = await api(`/workflows/${encodeURIComponent(id)}/trigger`, { method: "POST", body: { input } });
      toast(`Run ${r.run_id || r.id} queued`);
      location.hash = `#/runs/${encodeURIComponent(r.run_id || r.id)}`;
    } catch (err) { toast(`${err.code}: ${err.message}`, "err"); $("#trigger", el).disabled = false; }
  });
  $("#publish", el).addEventListener("click", async () => {
    const out = $("#pub-out", el);
    try {
      const r = await api(`/workflows/${encodeURIComponent(id)}/publish`, { method: "POST" });
      toast(`Published v${r.version}`);
      if (ctx.alive) route();
    } catch (err) {
      toast(`${err.code}: ${err.message}`, "err");
      out.innerHTML = errBox(err) + (err.details ? json(err.details) : "");
    }
  });
}

function gatePill(s) {
  const g = s.gate;
  if (!g || !g.requires_approval) return "";
  if (g.satisfied_by) return `<span class="pill ok" title="checked ${esc(g.checked_at || "")}">gate: approved (${esc(g.satisfied_by)})</span>`;
  if (s.status === "waiting" || s.status === "running") return `<span class="pill warn">gate: awaiting approval</span>`;
  return `<span class="pill bad">gate: NO APPROVAL — refused</span>`;
}

function stepCard(s, nodesById) {
  const attempts = Array.isArray(s.attempts) ? s.attempts : [];
  const meta = s.meta || {};
  const k = `step-${s.sequence}`;
  let branch = "";
  if (s.type === "condition" && s.output && typeof s.output === "object" && "result" in s.output) {
    const res = !!s.output.result;
    const n = nodesById.get(s.node_id) || {};
    const target = res ? n.on_true : n.on_false;
    branch = `<span class="pill info">result ${res ? "true" : "false"} → ${res ? "on_true" : "on_false"}${target !== undefined ? ` (${esc(target ?? "end")})` : ""}</span>`;
  }
  const tok = s.tokens ? `<span class="pill violet" title="prompt + completion">${num(s.tokens.prompt)} + ${num(s.tokens.completion)} = ${num(s.tokens.total)} tok</span>` : "";
  const replayed = attempts.some((a) => a && a.replayed) || meta.replayed === true;
  const replayPill = replayed ? `<span class="pill warn" title="The mock world recognised the Idempotency-Key and did not execute twice">replayed by world</span>` : "";
  const httpPill = meta.http_status != null ? `<span class="pill">HTTP ${esc(meta.http_status)}</span>` : "";
  const repaired = meta.repaired ? `<span class="pill warn">output repaired</span>` : "";
  const redCount = (meta.guardrails?.redactions || []).reduce((a, r) => a + (Number(r.count) || 0), 0);
  const redPill = redCount ? `<span class="pill info">${esc(redCount)} redaction${redCount === 1 ? "" : "s"}</span>` : "";
  const lastAttempt = attempts[attempts.length - 1];

  const calls = Array.isArray(meta.ai_calls) && meta.ai_calls.length ? `<h4>Model calls${meta.provider || meta.model ? ` <span class="muted" style="text-transform:none;letter-spacing:0">· ${esc([meta.provider, meta.model].filter(Boolean).join(" / "))}</span>` : ""}</h4>${meta.ai_calls.map((c, i) => `
      <div class="call ${c.valid ? "ok" : "bad"}">
        <div class="ch"><b>attempt ${esc(c.attempt ?? i + 1)}</b>
          <span class="pill ${c.valid ? "ok" : "bad"}">${c.valid ? "VALID" : "INVALID"}</span>
          <span class="muted">${esc(c.model || "")} · ${num(c.prompt_tokens)} + ${num(c.completion_tokens)} tok · ${esc(dur(c.latency_ms))}</span></div>
        ${Array.isArray(c.errors) && c.errors.length ? `<ul>${c.errors.map((e) => `<li>${esc(e)}</li>`).join("")}</ul>` : ""}
        <details data-k="${k}-raw-${i}"><summary>raw_text</summary><pre class="json" data-s="${k}-raw-${i}">${esc(c.raw_text ?? "")}</pre></details>
      </div>`).join("")}` : "";

  const g = meta.guardrails;
  const guard = g && ((g.redactions || []).length || (g.flags || []).length) ? `<h4>Guardrails</h4>
      ${(g.redactions || []).length ? table([
        { label: "Field", render: (r) => `<span class="mono">${esc(r.field)}</span>` },
        { label: "Kind", render: (r) => esc(r.kind) },
        { label: "Count", cls: "num", render: (r) => num(r.count) },
      ], g.redactions) : ""}
      ${(g.flags || []).length ? `<div style="margin-top:8px">${json(g.flags)}</div>` : ""}` : "";
  const inRisk = Array.isArray(meta.input_risk_flags) && meta.input_risk_flags.length ? `<h4>Input risk flags</h4>${json(meta.input_risk_flags)}` : "";

  const sumParts = ["input", "output", "attempts"];
  if (s.idempotency_key) sumParts.unshift("idempotency key");
  if (calls) sumParts.push("model calls");
  if (guard) sumParts.push("guardrails");

  return `
    <li class="step ${stClass(s.status)}">
      <div class="step-head">
        <span class="seq">#${esc(s.sequence)}</span>
        <span class="nid">${esc(s.node_id)}</span>
        ${typeTag(s.type)}
        ${badge(s.status)}
        <span class="step-meta">attempt ${esc(s.attempt ?? attempts.length ?? 1)} · ${esc(s.duration_ms != null ? dur(s.duration_ms) : TERMINAL.has(s.status) ? "—" : "in progress")} · started ${time(s.started_at)}</span>
      </div>
      <div class="pills">${branch}${tok}${gatePill(s)}${replayPill}${httpPill}${repaired}${redPill}${s.approval_id ? `<span class="pill mono">${esc(s.approval_id)}</span>` : ""}</div>
      ${s.error ? `<div class="box error-box small" style="margin:8px 0 0"><b class="mono">${esc(s.error.code || "error")}</b> <span class="msg">${esc(s.error.message || "")}</span></div>` : ""}
      ${s.status === "sleeping" && s.wake_at ? `<div class="muted small" style="margin-top:6px">sleeping until ${time(s.wake_at)}</div>` : ""}
      ${s.status === "retrying" ? `<div class="muted small" style="margin-top:6px">retrying${s.next_attempt_at ? ` at ${time(s.next_attempt_at)}` : ""}${lastAttempt?.retry_in_s != null ? ` (backoff ${esc(lastAttempt.retry_in_s)} s)` : ""}${lastAttempt?.error ? ` · last error: ${esc(typeof lastAttempt.error === "string" ? lastAttempt.error : lastAttempt.error.message || JSON.stringify(lastAttempt.error))}` : ""}</div>` : ""}
      <details data-k="${k}"><summary>${esc(sumParts.join(" · "))}</summary>
        ${s.idempotency_key ? `<p class="small" style="margin:6px 0">Idempotency-Key: <code>${esc(s.idempotency_key)}</code></p>` : ""}
        <div class="cols-even"><div><h4>Resolved input</h4><div>${json(s.input)}</div></div><div><h4>Output</h4>${json(s.output)}</div></div>
        <h4>Attempts</h4>${json(attempts)}
        ${calls}${guard}${inRisk}
      </details>
    </li>`;
}

function runHtml(r, decider) {
  const approvals = Array.isArray(r.approvals) ? r.approvals : [];
  const pending = approvals.find((a) => a.status === "pending");
  const steps = Array.isArray(r.steps) ? [...r.steps].sort((a, b) => (a.sequence ?? 0) - (b.sequence ?? 0)) : [];
  const nodesById = new Map(nodeList(r.definition_snapshot).map((n) => [n.id, n]));
  const limits = r.limits || {};
  const runMs = r.started_at ? (toDate(r.finished_at) || new Date()) - toDate(r.started_at) : null;
  const flags = Array.isArray(r.risk_flags) ? r.risk_flags : [];
  const terminal = TERMINAL.has(r.status);

  return `
    <div class="page-head" style="margin-bottom:4px">
      <h1><span class="mono" style="font-size:19px">${esc(r.run_id || r.id)}</span> ${badge(r.status)}${r.cancel_requested && !terminal ? ` <span class="pill warn">cancel requested</span>` : ""}</h1>
      <div class="row" style="margin:0">
        ${!terminal ? `<span class="muted small">live · polling 1.5 s</span><button type="button" class="ghost" data-act="cancel" ${r.cancel_requested ? "disabled" : ""}>Cancel run</button>` : ""}
      </div>
    </div>
    <div class="sub">
      <span>workflow <a href="#/workflows/${esc(encodeURIComponent(r.workflow_id))}">${esc(r.workflow_id)}</a> <span class="small">v${esc(r.workflow_version ?? "—")}</span></span>
      <span>trigger <b>${esc(r.trigger_type ?? "—")}</b></span>
      <span>steps <b>${num(r.steps_executed ?? 0)}</b> / ${num(limits.max_steps ?? "—")}</span>
      <span>AI tokens <b>${num(r.ai_tokens_used ?? 0)}</b>${limits.max_ai_tokens != null ? ` / ${num(limits.max_ai_tokens)}` : ""}</span>
      <span>started ${time(r.started_at)}${r.finished_at ? ` · finished ${time(r.finished_at)}` : ""}${runMs != null && !isNaN(runMs) ? ` · ${esc(dur(runMs))}` : ""}</span>
      ${!terminal && r.current_node_id ? `<span>at node <b class="mono">${esc(r.current_node_id)}</b></span>` : ""}
      ${r.ended_reason ? `<span>ended: <b>${esc(r.ended_reason)}</b></span>` : ""}
    </div>

    ${flags.length ? `<div class="box risk-box">
      <b class="t">Prompt-injection patterns detected in the trigger payload</b>
      <span style="color:var(--text)">The text below is shown escaped, never executed. Approval gates are enforced by the engine, so nothing the AI outputs can skip them.</span>
      <ul class="flags">${flags.map((f) => `<li><code>${esc(f.rule)}</code> in <span class="mono">${esc(f.field)}</span>: <q>${esc(f.excerpt)}</q></li>`).join("")}</ul>
    </div>` : ""}

    ${r.error ? `<div class="box error-box"><b class="t mono">${esc(r.error.code || "error")}${r.error.node_id ? ` <span style="font-weight:500">at node ${esc(r.error.node_id)}</span>` : ""}</b><div class="msg">${esc(r.error.message || "")}</div></div>` : ""}

    ${pending ? `<div class="box approval-box">
      <div class="lbl">Waiting for approval · node <span class="mono">${esc(pending.node_id)}</span></div>
      <div class="msg">${esc(pending.message)}</div>
      <div class="row" style="margin-bottom:0">
        <input id="decider" placeholder="your name" value="${esc(decider)}" aria-label="Decider name" style="width:200px">
        <button type="button" class="ok" data-act="approve" data-id="${esc(pending.id)}">Approve</button>
        <button type="button" class="danger" data-act="reject" data-id="${esc(pending.id)}">Reject</button>
        <span class="muted mono small">${esc(pending.id)}</span>
      </div>
    </div>` : ""}

    <h2>Step timeline <span class="muted small">(${steps.length})</span></h2>
    ${steps.length ? `<ol class="timeline">${steps.map((s) => stepCard(s, nodesById)).join("")}</ol>` : `<div class="empty">No steps yet — the run is ${esc(String(r.status || "queued").replace(/_/g, " "))}.</div>`}

    ${approvals.length ? `<h2>Approvals</h2>${table([
      { label: "Approval", render: (a) => `<span class="mono">${esc(a.id)}</span>` },
      { label: "Node", render: (a) => `<span class="mono">${esc(a.node_id)}</span>` },
      { label: "Status", render: (a) => badge(a.status) },
      { label: "Decided by", render: (a) => esc(a.decided_by || "—") },
      { label: "Decided", render: (a) => time(a.decided_at) },
      { label: "Note", render: (a) => esc(a.decision_note || "") },
    ], approvals)}` : ""}

    <details class="block" data-k="run-input"><summary>Trigger input</summary>${json(r.input)}</details>
    <details class="block" data-k="run-def"><summary>Definition snapshot (what this run executes)</summary>${json(r.definition_snapshot)}</details>`;
}

async function viewRun(el, ctx, [id]) {
  const path = `/runs/${encodeURIComponent(id)}`;
  let run = await api(path);
  let lastSig = "";
  const draw = (r, force = false) => {
    const sig = JSON.stringify(r);
    if (!force && sig === lastSig) return;
    lastSig = sig;
    run = r;
    patch(el, runHtml(r, getDecider()));
  };
  draw(run, true);

  el.addEventListener("input", (e) => { if (e.target.id === "decider") setDecider(e.target.value); });
  el.addEventListener("click", async (e) => {
    const b = e.target.closest("button[data-act]");
    if (!b || !el.contains(b)) return;
    const act = b.dataset.act;
    b.disabled = true;
    try {
      if (act === "approve" || act === "reject") {
        const who = ($("#decider", el)?.value || "").trim() || "demo-operator";
        setDecider(who);
        await decide(b.dataset.id, act, who);
        toast(act === "approve" ? `Approved by ${who}` : `Rejected by ${who}`);
        refreshBadge();
      } else if (act === "cancel") {
        await api(`${path}/cancel`, { method: "POST" });
        toast("Cancel requested");
      }
      if (ctx.alive) { draw(await api(path)); ensurePolling(); }
    } catch (err) {
      toast(`${err.code || "error"}: ${err.message}`, "err");
      b.disabled = false;
    }
  });

  let polling = false;
  function ensurePolling() {
    if (polling || TERMINAL.has(run.status)) return;
    polling = true;
    ctx.every(async () => {
      const r = await api(path);
      draw(r);
      if (TERMINAL.has(r.status)) { polling = false; refreshBadge(); return false; }
      return true;
    }, 1500);
  }
  ensurePolling();
}

async function viewWorld(el, ctx) {
  el.innerHTML = `
    <div class="page-head"><h1>Mock world</h1><span class="muted small">refresh 2 s</span></div>
    <p class="muted" style="margin-top:-6px;max-width:860px">The simulated external system that side-effect steps call. Every request carries an Idempotency-Key; a repeated key is recorded as a replay instead of executing twice.</p>
    <div class="row">
      <button type="button" class="ok" data-cfg='{"mode":"ok","fail_rate":0,"latency_ms":0}'>Healthy</button>
      <button type="button" class="danger" data-cfg='{"mode":"down"}'>Take down</button>
      <button type="button" class="ghost" data-cfg='{"fail_rate":0.3}'>Flaky 30%</button>
      <button type="button" class="ghost" data-cfg='{"latency_ms":3000}'>Slow 3s</button>
      <span class="spacer"></span>
      <button type="button" class="ghost" id="reset">Reset ledger</button>
    </div>
    <div id="world-body"></div>`;
  const body = $("#world-body", el);
  let cfg = null;
  const cfgHtml = () => {
    if (!cfg) return `<div class="tile"><div class="n">?</div><div class="l">config unavailable</div></div>`;
    const mode = String(cfg.mode ?? "?");
    const st = mode === "down" ? "down" : (Number(cfg.fail_rate) > 0 ? "flaky" : "ok");
    const label = st === "flaky" ? `${mode} · flaky` : mode;
    return `<div class="tile"><div class="l">mode</div><div style="margin-top:6px"><span class="badge ${stClass(st)}">${esc(label)}</span></div></div>
      <div class="tile"><div class="l">fail_rate</div><div class="n" style="font-size:20px">${esc(Math.round((Number(cfg.fail_rate) || 0) * 100))}%</div></div>
      <div class="tile"><div class="l">latency</div><div class="n" style="font-size:20px">${esc(dur(Number(cfg.latency_ms) || 0))}</div></div>`;
  };
  const draw = async () => {
    const [ledger, c] = await Promise.all([
      api("/world/ledger"),
      api("/world/config", { method: "POST", body: {} }).catch(() => cfg),
    ]);
    cfg = c || cfg;
    const entries = Array.isArray(ledger?.entries) ? [...ledger.entries] : [];
    entries.sort((a, b) => (b.seq ?? 0) - (a.seq ?? 0));
    const isErr = (e) => typeof e.status === "number" && e.status >= 300;
    const replayed = entries.filter((e) => e.replayed).length;
    const executed = entries.filter((e) => !e.replayed && !isErr(e)).length;
    const failed = entries.filter((e) => !e.replayed && isErr(e)).length;
    patch(body, `
      <div class="world-state tiles" style="margin-top:6px">${cfgHtml()}
        <div class="tile st-succeeded"><div class="l">executed</div><div class="n" style="color:var(--green)">${num(executed)}</div></div>
        <div class="tile"><div class="l">replays absorbed</div><div class="n" style="color:var(--amber)">${num(replayed)}</div></div>
        ${failed ? `<div class="tile"><div class="l">rejected</div><div class="n" style="color:var(--red)">${num(failed)}</div></div>` : ""}
        <div class="tile"><div class="l">ledger entries</div><div class="n">${num(ledger?.count ?? entries.length)}</div></div>
      </div>
      <h2>Ledger <span class="muted small">(newest first)</span></h2>
      ${table([
        { label: "#", cls: "num", render: (e) => esc(e.seq) },
        { label: "Time", render: (e) => time(e.ts) },
        { label: "Action", render: (e) => `<b class="mono">${esc(e.action)}</b>` },
        { label: "Idempotency-Key", render: (e) => (e.idempotency_key ? `<span class="mono small">${esc(e.idempotency_key)}</span>` : `<span class="muted">none</span>`) },
        { label: "Result", render: (e) => (e.replayed ? `<span class="pill warn">replayed</span>` : `<span class="pill ${isErr(e) ? "bad" : "ok"}">${esc(e.status ?? "ok")}</span>`) },
        { label: "Payload", render: (e) => `<code class="trunc" title="${esc(JSON.stringify(e.payload))}">${esc(JSON.stringify(e.payload))}</code>` },
      ], entries, "Ledger is empty. Side-effect steps will appear here.")}`);
  };
  el.addEventListener("click", async (e) => {
    const b = e.target.closest("button[data-cfg], #reset");
    if (!b) return;
    try {
      if (b.id === "reset") { await api("/world/reset", { method: "POST" }); toast("Ledger reset"); }
      else { cfg = await api("/world/config", { method: "POST", body: JSON.parse(b.dataset.cfg) }); toast(`World: ${b.textContent.trim()}`); }
      await draw();
    } catch (err) { toast(`${err.code || "error"}: ${err.message}`, "err"); }
  });
  await draw();
  ctx.every(draw, 2000);
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
$("#token-btn").addEventListener("click", () => {
  const t = prompt("Relay API token (sent as Authorization: Bearer …)", getToken());
  if (t && t.trim()) { setToken(t.trim()); toast("Token saved"); route(); refreshBadge(); }
});
window.addEventListener("hashchange", route);
loadHealth();
route();
refreshBadge();
setInterval(refreshBadge, 4000);
</script>
